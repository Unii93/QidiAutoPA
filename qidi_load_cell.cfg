# qidi_load_cell.cfg - expose the QIDI Q2's CS1237 as a Klipper [load_cell]
# so autopa (https://github.com/G0BL1N/autopa) can use it for pressure advance.
#
# Install:
#   cp load_cell.py        ~/klipper/klippy/extras/
#   cp qidi_load_cell.cfg  ~/printer_data/config/
#   # in printer.cfg, ABOVE the "#*# <--- SAVE_CONFIG" marker:
#   [include qidi_load_cell.cfg]
#
# This REPLACES the stock klipper/klippy/extras/load_cell.py (an earlier
# hand-made attempt). There must be exactly ONE [load_cell] section.
#
# There is NO bulk stream on this firmware, so samples come from a blocking
# query (~3.9 ms round trip on this Q2 -> ceiling ~250 Hz). Nothing is polled
# in the background: the sampler runs only inside an active calibration window.

[load_cell]
# counts per gram-force. ONLY affects the cosmetic grams column and any
# force-threshold display -- autopa's Sweep finds PA from the response SHAPE,
# which a constant scale factor cannot change. Leave it if unmeasured.
counts_per_gf: 201.0

# Reported sensor rate. 0 = report the measured rate (recommended).
samples_per_second: 0

# Target poll rate during a calibration. The link ceiling is ~250 Hz; 120 Hz
# leaves reactor headroom for Klipper's other work. Raise towards 200 if
# LOAD_CELL_DEBUG shows no "Timer too close" warnings; lower if they appear.
poll_hz: 120.0
